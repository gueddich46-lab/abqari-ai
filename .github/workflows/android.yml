name: Build Abqari Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'store-launcher.svg'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Android project
        run: |
          mkdir -p android/app/src/main/java/com/abqari/ai android/app/src/main/res/mipmap-xxxhdpi
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'AbqariAI'
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.abqari.ai'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.abqari.ai'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="عبقري AI" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:supportsRtl="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/com/abqari/ai/MainActivity.java <<'EOF'
          package com.abqari.ai;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.view.View;
          import android.graphics.Color;
          import android.widget.Toast;
          public class MainActivity extends Activity {
            WebView web;
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setStatusBarColor(Color.rgb(8,13,32));
              getWindow().setNavigationBarColor(Color.rgb(8,13,32));
              web=new WebView(this);
              web.setBackgroundColor(Color.rgb(8,13,32));
              web.getSettings().setJavaScriptEnabled(true);
              web.getSettings().setDomStorageEnabled(true);
              web.getSettings().setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient());
              setContentView(web);
              web.loadUrl("https://gueddich46-lab.github.io/abqari-ai/");
            }
            @Override public void onBackPressed() {
              if(web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF
      - name: Generate exact store icon
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='store-launcher.svg',write_to='android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png',output_width=512,output_height=512)
          PY
      - name: Build APK
        run: cd android && gradle --no-daemon assembleDebug
      - name: Publish direct-download APK
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/abqari-ai.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/abqari-ai.apk
          git commit -m 'Publish Abqari AI Android APK' || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: abqari-ai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
